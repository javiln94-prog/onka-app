<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>onka — Fabricación de mobiliario</title>
<script>
  // Red de seguridad: si ocurre CUALQUIER error de JavaScript no controlado
  // (incluidos fallos del propio traductor de código, antes de que React
  // llegue a arrancar), lo mostramos en pantalla en vez de dejarla en blanco.
  // Esto es clave para poder diagnosticar fallos en el móvil, donde no hay
  // consola de errores a mano.
  (function () {
    var mostrado = false;
    function mostrarError(mensaje, detalle) {
      if (mostrado) return;
      mostrado = true;
      var root = document.getElementById("root");
      if (!root) { document.addEventListener("DOMContentLoaded", function () { mostrarError(mensaje, detalle); }); return; }
      root.innerHTML =
        '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:sans-serif;background:#F6F4EF;">' +
        '<div style="max-width:480px;text-align:center;">' +
        '<div style="font-size:40px;margin-bottom:12px;">\u26A0\uFE0F</div>' +
        "<h2 style=\"margin-bottom:8px;\">Ha fallado algo al cargar la app</h2>" +
        '<p style="color:#726E64;font-size:14px;margin-bottom:10px;">' + mensaje + '</p>' +
        (detalle ? '<pre style="text-align:left;background:#fff;border:1px solid #E4E1D8;border-radius:8px;padding:10px;font-size:11px;overflow:auto;max-height:160px;color:#B3433A;">' + detalle.replace(/</g, "&lt;") + '</pre>' : "") +
        '<button onclick="window.location.reload()" style="margin-top:14px;padding:10px 18px;border-radius:9px;border:none;background:#0A0A0A;color:#fff;font-weight:600;cursor:pointer;">Reintentar</button>' +
        "</div></div>";
    }
    window.addEventListener("error", function (e) {
      mostrarError("Error de JavaScript. Envía esta captura para que lo revisen:", (e.message || "") + "\n" + (e.filename || "") + ":" + (e.lineno || "") + ":" + (e.colno || ""));
    });
    window.addEventListener("unhandledrejection", function (e) {
      mostrarError("Error al comunicarse con el servidor. Envía esta captura para que lo revisen:", String((e.reason && (e.reason.stack || e.reason.message)) || e.reason || ""));
    });
    window.__mostrarErrorCarga = mostrarError;
  })();
</script>

<script>
  // Si por lo que sea (red lenta, bloqueador de contenido, etc.) alguna de las
  // librerías de arriba no llega a cargar, sin esto la pantalla se queda en
  // blanco sin ninguna pista. Con esto, mostramos un aviso claro en su lugar.
  window.addEventListener("load", function () {
    setTimeout(function () {
      var faltan = [];
      if (typeof React === "undefined") faltan.push("React");
      if (typeof ReactDOM === "undefined") faltan.push("ReactDOM");
      if (typeof Babel === "undefined") faltan.push("Babel");
      if (faltan.length) {
        var root = document.getElementById("root");
        if (root && !root.hasChildNodes()) {
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:sans-serif;background:#F6F4EF;">' +
            '<div style="max-width:440px;text-align:center;">' +
            '<div style="font-size:40px;margin-bottom:12px;">📡</div>' +
            "<h2 style=\"margin-bottom:8px;\">No se pudo cargar la aplicación</h2>" +
            '<p style="color:#726E64;font-size:14px;margin-bottom:16px;">No se pudieron descargar algunos componentes necesarios (' + faltan.join(", ") + '). Suele deberse a una conexión inestable o a un bloqueador de contenido activo en el navegador. Comprueba tu conexión a internet y vuelve a intentarlo.</p>' +
            '<button onclick="window.location.reload()" style="padding:10px 18px;border-radius:9px;border:none;background:#0A0A0A;color:#fff;font-weight:600;cursor:pointer;">Reintentar</button>' +
            "</div></div>";
        }
      }
    }, 4000);
  });
</script>

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" data-type="module">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

/* =================================================================
   CSS — Identidad ONKA
================================================================= */
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --paper:#F6F4EF; --ink:#0E0E0E; --panel:#FFFFFF; --line:#E4E1D8;
  --primary:#0A0A0A; --primary-dark:#000000; --accent:#A9762E; --accent-ink:#3A2707;
  --ok:#2F7D5C; --warn:#C1440E; --muted:#726E64;
  --office:#3B6FA0; --fabrica:#8A5A2B;
}
*{box-sizing:border-box;}
.app{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);min-height:100%;}
.mono{font-family:ui-monospace,SFMono-Regular,"Roboto Mono",monospace;}
.display{font-family:"Space Grotesk","Segoe UI",sans-serif;}
h1,h2,h3{font-family:"Space Grotesk","Segoe UI",sans-serif; margin:0; letter-spacing:-0.01em;}
.btn{border:none;border-radius:9px;padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .08s ease, box-shadow .15s ease;font-family:"Inter",sans-serif;}
.btn:active{transform:scale(0.97);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{filter:brightness(1.06);}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn-ghost:hover{background:#EDEAE1;}
.btn-danger{background:#fff;color:var(--warn);border:1px solid #ECC;}
.btn-danger:hover{background:#FCEEE8;}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;}
.input, select.input, textarea.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit;}
textarea.input{resize:vertical;min-height:70px;}
.input:focus, select.input:focus, textarea.input:focus{outline:2px solid var(--ink);outline-offset:1px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.pill-office{background:#E8F0F8;color:var(--office);}
.pill-fabrica{background:#F3EADD;color:var(--fabrica);}
.pill-admin{background:#F2E7D5;color:var(--accent-ink);}
.tab{padding:10px 16px;border-radius:9px;font-weight:600;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:8px;color:#C9C6BE;}
.tab.active{background:rgba(255,255,255,0.12);color:#fff;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:8px 10px;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--line);}
::placeholder{color:#9AA0A6;}
.scrollbar::-webkit-scrollbar{height:6px;width:6px;}
.scrollbar::-webkit-scrollbar-thumb{background:#D8D4C9;border-radius:6px;}
.table-wrap{overflow-x:auto;}
.layout-2col{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px;}
.layout-cal{display:grid;grid-template-columns:1fr 300px;gap:20px;}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.25);}
.cal-cell{height:80px;border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:2px;overflow:hidden;cursor:pointer;}
.cal-tag{font-size:9px;border-radius:5px;padding:1px 4px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.checkrow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;}
@media (max-width: 780px){
  .layout-2col, .layout-cal{grid-template-columns:1fr;}
  .card{padding:16px;border-radius:12px;}
  .cal-cell{height:64px;}

const pad = (n) => String(n).padStart(2, "0");
const toISODate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => toISODate(new Date());
const fmtTime = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const isWeekend = (isoDate) => { const d = new Date(isoDate + "T00:00:00"); const day = d.getDay(); return day === 0 || day === 6; };
const DIAS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
const MESES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

function dailyCap(isoDate) {
  const d = new Date(isoDate + "T00:00:00");
  const day = d.getDay();
  if (day >= 1 && day <= 4) return 8.5;
  if (day === 5) return 5;
  return 0;
}

/* =================================================================
   Cliente API
================================================================= */
function useApi(token, onUnauthorized) {
  return useCallback(async (method, path, body) => {
    const opts = { method, headers: {} };
    if (token) opts.headers["Authorization"] = "Bearer " + token;
    if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    const r = await fetch(path, opts);
    if (r.status === 401) { onUnauthorized && onUnauthorized(); throw new Error("No autenticado"); }
    let data = null;
    try { data = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error((data && data.error) || "Error de red");
    return data;
  }, [token, onUnauthorized]);
}

function getPosition() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 8000 }
    );
  });
}
async function reverseGeocode(lat, lng) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=16`, { headers: { Accept: "application/json" } });
    if (!r.ok) return null;
    const j = await r.json();
    return j.display_name || null;
  } catch (e) { return null; }
}

/* =================================================================
   Capturador de errores — evita pantallas en blanco: si algo falla
   de forma inesperada, muestra el motivo en vez de romper toda la app.
================================================================= */
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("Error de la app:", error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, background: "var(--paper, #F6F4EF)", fontFamily: "sans-serif" }}>
          <div style={{ maxWidth: 480, textAlign: "center" }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>⚠️</div>
            <h2 style={{ marginBottom: 8 }}>Algo ha fallado</h2>
            <p style={{ color: "#726E64", fontSize: 14, marginBottom: 16 }}>{String(this.state.error.message || this.state.error)}</p>
            <button onClick={() => window.location.reload()} style={{ padding: "10px 18px", borderRadius: 9, border: "none", background: "#0A0A0A", color: "#fff", fontWeight: 600, cursor: "pointer" }}>Recargar la página</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

// Envoltorio seguro sobre localStorage: en Safari (sobre todo en Navegación
// Privada) puede lanzar excepciones al leer/escribir. Con esto, la app sigue
// funcionando en esa sesión aunque no pueda recordar el inicio de sesión.
const storage = {
  get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch (e) {} },
  remove(key) { try { localStorage.removeItem(key); } catch (e) {} },
};

function App() {
  const [token, setToken] = useState(() => storage.get("onka_token") || null);
  const [user, setUser] = useState(() => { try { return JSON.parse(storage.get("onka_user")); } catch (e) { return null; } });
  const [tab, setTab] = useState("fichaje");
  const [config, setConfig] = useState(null);
  const [events, setEvents] = useState([]);
  const [toast, setToast] = useState(null);

  const showToast = useCallback((msg) => { setToast(msg); setTimeout(() => setToast(null), 4200); }, []);

  const logout = useCallback((mensaje) => {
    setToken(null); setUser(null); setConfig(null); setEvents([]);
    storage.remove("onka_token"); storage.remove("onka_user");
    if (mensaje) showToast(mensaje);
  }, [showToast]);

  const onUnauthorized = useCallback(() => {
    logout("Tu sesión ya no es válida en el servidor (puede haberse reiniciado). Vuelve a entrar con tu PIN.");
  }, [logout]);

  const api = useApi(token, onUnauthorized);
  const refreshConfig = useCallback(() => { if (token) api("GET", "/api/config").then(setConfig).catch(() => {}); }, [api, token]);
  const refreshEvents = useCallback(() => { if (token) api("GET", "/api/events").then(setEvents).catch(() => {}); }, [api, token]);

  useEffect(() => { if (token) { refreshConfig(); refreshEvents(); } }, [token]); // eslint-disable-line

  const onLogin = (u, t) => { setUser(u); setToken(t); storage.set("onka_token", t); storage.set("onka_user", JSON.stringify(u)); };
  const onLogout = () => { api("POST", "/api/logout").catch(() => {}); logout(); };

  return (
    <div className="app" style={{ minHeight: "100vh" }}>
      <style>{CSS}</style>
      {!token || !user ? (
        <Login onLogin={onLogin} />
      ) : (
        <Shell user={user} api={api} tab={tab} setTab={setTab} onLogout={onLogout} config={config} refreshConfig={refreshConfig} events={events} refreshEvents={refreshEvents} showToast={showToast} />
      )}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

function Login({ onLogin }) {
  const [users, setUsers] = useState([]);
  const [selected, setSelected] = useState("");
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    fetch("/api/public-users")
      .then(async (r) => {
        const data = await r.json().catch(() => null);
        if (!r.ok || !Array.isArray(data)) {
          throw new Error((data && data.error) || `El servidor respondió con un error (${r.status}). Avisa al administrador.`);
        }
        return data;
      })
      .then((list) => { setUsers(list); if (list.length) setSelected(list[0].id); })
      .catch((e) => setError(e.message || "No se pudo conectar con el servidor."));
  }, []);

  const submit = async (e) => {
    e.preventDefault();
    if (!selected) return;
    setBusy(true); setError("");
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ userId: selected, pin }) });
      const data = await r.json();
      if (!r.ok) { setError(data.error || "Error de acceso"); setBusy(false); return; }
      onLogin(data.user, data.token);
    } catch (e) { setError("No se pudo conectar con el servidor."); }
    setBusy(false);
  };

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, background: "var(--primary)" }}>
      <form onSubmit={submit} className="card" style={{ width: 380, maxWidth: "100%", background: "#111", border: "1px solid #2A2A2A", padding: 32 }}>
        <div style={{ marginBottom: 30, textAlign: "center" }}>
          <img src={ONKA_LOGO_PLACEHOLDER} alt="ONKA" style={{ width: 230, maxWidth: "100%", display: "block", margin: "0 auto" }} />
          <div style={{ height: 1, background: "#2A2A2A", margin: "18px auto 14px", width: 60 }} />
          <div style={{ fontSize: 11.5, letterSpacing: ".18em", textTransform: "uppercase", color: "#8A8880" }}>Fabricación de mobiliario</div>
        </div>
        <h2 style={{ fontSize: 18, marginBottom: 4, color: "#fff" }}>Identifícate</h2>
        <p style={{ color: "#9A978E", fontSize: 13, marginTop: 4, marginBottom: 16 }}>Selecciona tu usuario para fichar, imputar horas o ver el calendario.</p>
        <label style={{ fontSize: 12.5, fontWeight: 600, color: "#9A978E" }}>Usuario</label>
        <select className="input" style={{ marginTop: 6, marginBottom: 12 }} value={selected} onChange={(e) => { setSelected(e.target.value); setError(""); }}>
          {users.map((u) => <option key={u.id} value={u.id}>{u.name}</option>)}
        </select>
        <label style={{ fontSize: 12.5, fontWeight: 600, color: "#9A978E" }}>PIN</label>
        <input className="input mono" style={{ marginTop: 6 }} type="password" inputMode="numeric" placeholder="••••" value={pin} onChange={(e) => { setPin(e.target.value); setError(""); }} />
        {error && <div style={{ color: "#E8845A", fontSize: 12.5, marginTop: 8 }}>{error}</div>}
        <button className="btn btn-accent" style={{ width: "100%", justifyContent: "center", marginTop: 16 }} type="submit" disabled={busy}>{busy ? "Entrando…" : "Entrar"}</button>
      </form>
    </div>
  );
}

  const isAdmin = user.role === "admin";

  return (

          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>

        <div style={{ display: "flex", gap: 4, marginTop: 16, flexWrap: "wrap" }}>

          <div className={`tab ${tab === "horas" ? "active" : ""}`} onClick={() => setTab("horas")}><FolderKanban size={15} /> Imputación</div>
          <div className={`tab ${tab === "calendario" ? "active" : ""}`} onClick={() => setTab("calendario")}><CalIcon size={15} /> Calendario</div>

}

/* =================================================================
   ALERTAS
================================================================= */
function esDiaLaborable(events, isoDate) {
  if (isWeekend(isoDate)) return false;
  const evento = events.find((e) => e.date === isoDate && (e.type === "vacaciones" || (e.type === "festivo" && (e.festivoScope === "nacional" || e.festivoScope === "autonomico"))));
  return !evento;
}
function AlertaFichaje({ misFichajes, events }) {
  const iso = todayISO();
  if (!esDiaLaborable(events, iso)) return null;
  if (new Date().getHours() < 10) return null;
  const entradaHoy = misFichajes.some((f) => f.type === "entrada" && f.date === iso);
  if (entradaHoy) return null;
  return (
    <div className="card" style={{ borderColor: "#F0C9A8", background: "#FFF6EC", marginBottom: 16, display: "flex", gap: 10, alignItems: "flex-start" }}>
      <AlertTriangle size={18} color="var(--warn)" style={{ flexShrink: 0, marginTop: 2 }} />
      <div>
        <div style={{ fontWeight: 700, fontSize: 13.5 }}>Todavía no has fichado tu entrada hoy</div>
        <div style={{ fontSize: 12.5, color: "var(--muted)" }}>Es un día laborable y no hay registro de entrada. Ficha en cuanto puedas.</div>
      </div>
    </div>
  );
}

function AlertaEventos({ events, user }) {
  const [dismissed, setDismissed] = useState([]);
  const activos = useMemo(() => {
    const now = new Date();
    return events.filter((e) => {
      if (!e.alerta || !e.alerta.activa) return false;
      if (e.invitados !== "todos" && !(Array.isArray(e.invitados) && e.invitados.includes(user.id))) return false;
      const dt = new Date(`${e.date}T${e.time || "09:00"}:00`);
      const windowStart = new Date(dt.getTime() - (e.alerta.minutosAntes || 0) * 60000);
      return now >= windowStart && now <= dt;
    });
  }, [events, user.id]);

  const visibles = activos.filter((e) => !dismissed.includes(e.id));
  if (visibles.length === 0) return null;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
      {visibles.map((e) => (
        <div key={e.id} className="card" style={{ borderColor: "#CFE0D6", background: "#EEF6F1", display: "flex", gap: 10, alignItems: "flex-start" }}>
          <BellRing size={18} color="var(--ok)" style={{ flexShrink: 0, marginTop: 2 }} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 13.5 }}>Recordatorio: {e.title}</div>
            <div style={{ fontSize: 12.5, color: "var(--muted)" }}>
              {e.time ? `Hoy a las ${e.time}` : "Hoy"}{e.location ? ` · ${e.location}` : ""}
            </div>
          </div>
          <button className="btn btn-ghost btn-sm" onClick={() => setDismissed((d) => [...d, e.id])}><X size={13} /></button>
        </div>
      ))}
    </div>
  );
}

/* =================================================================
   PANTALLA 1 — FICHAJE
================================================================= */
function Fichaje({ api, user, misFichajes, refresh, showToast }) {
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);

  const sorted = useMemo(() => [...misFichajes].sort((a, b) => (a.timestamp < b.timestamp ? 1 : -1)), [misFichajes]);
  const ultimoHoy = sorted.find((f) => f.date === todayISO());
  const proximaAccion = !ultimoHoy || ultimoHoy.type === "salida" ? "entrada" : "salida";

  const fichar = async () => {
    setBusy(true); setMsg(null);
    const pos = await getPosition();
    let label = null;
    if (pos) label = await reverseGeocode(pos.lat, pos.lng);
    try {
      await api("POST", "/api/fichajes", { type: proximaAccion, lat: pos?.lat ?? null, lng: pos?.lng ?? null, accuracy: pos?.accuracy ?? null, locationLabel: label });
      setMsg(pos ? `${proximaAccion === "entrada" ? "Entrada" : "Salida"} registrada con ubicación.` : `${proximaAccion === "entrada" ? "Entrada" : "Salida"} registrada, pero no se pudo obtener la ubicación.`);
      refresh();
    } catch (e) { showToast("No se pudo registrar el fichaje. Comprueba tu conexión."); }
    setBusy(false);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div className="layout-2col">
        <div className="card" style={{ textAlign: "center" }}>
          <div className="mono" style={{ fontSize: 13, color: "var(--muted)", marginBottom: 6 }}>{DIAS[new Date().getDay()]}, {new Date().getDate()} de {MESES[new Date().getMonth()]}</div>
          <div className="display mono" style={{ fontSize: 40, fontWeight: 700, margin: "8px 0 18px" }}><RelojEnVivo /></div>
          <button className={`btn ${proximaAccion === "entrada" ? "btn-primary" : "btn-accent"}`} style={{ width: "100%", justifyContent: "center", padding: "16px", fontSize: 16, borderRadius: 14 }} onClick={fichar} disabled={busy}>
            <Clock size={18} /> {busy ? "Obteniendo ubicación…" : `Fichar ${proximaAccion}`}
          </button>
          {msg && <div style={{ marginTop: 12, fontSize: 12.5, color: "var(--muted)", display: "flex", gap: 6, alignItems: "flex-start", textAlign: "left" }}><MapPin size={14} style={{ flexShrink: 0, marginTop: 2 }} /> <span>{msg}</span></div>}
          <div style={{ marginTop: 16, fontSize: 11.5, color: "var(--muted)", lineHeight: 1.5 }}>Tu ubicación se registra en el momento del fichaje, sea cual sea el lugar.</div>
        </div>

        <div className="card">
          <h3 style={{ fontSize: 15, marginBottom: 12 }}>Tu historial reciente</h3>
          <div className="table-wrap scrollbar" style={{ maxHeight: 380, overflowY: "auto" }}>
            <table>
              <thead><tr><th>Fecha</th><th>Hora</th><th>Tipo</th><th>Ubicación</th></tr></thead>
              <tbody>
                {sorted.slice(0, 30).map((f) => (
                  <tr key={f.id}>
                    <td className="mono">{f.date}</td><td className="mono">{f.time}</td>
                    <td><span className="pill" style={{ background: f.type === "entrada" ? "#E7F3EC" : "#FBEAEA", color: f.type === "entrada" ? "var(--ok)" : "var(--warn)" }}>{f.type}</span></td>
                    <td style={{ maxWidth: 260 }}><UbicacionCelda f={f} /></td>
                  </tr>
                ))}
                {sorted.length === 0 && <tr><td colSpan={4} style={{ color: "var(--muted)", textAlign: "center", padding: 20 }}>Todavía no hay fichajes.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div className="card">
        <h3 style={{ fontSize: 14, marginBottom: 10 }}>Horario de la empresa</h3>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 13 }}>
          <div><strong>Lunes a jueves:</strong> 8:00–10:00 · <span style={{ color: "var(--muted)" }}>10:00–10:30 almuerzo</span> · 10:30–14:00 · <span style={{ color: "var(--muted)" }}>14:00–15:00 comida</span> · 15:00–18:00</div>
          <div><strong>Viernes:</strong> 8:00–13:30 <span style={{ color: "var(--muted)" }}>(con 30 min de almuerzo, 10:00–10:30)</span></div>
        </div>
      </div>
    </div>
  );
}

function UbicacionCelda({ f }) {
  if (f.lat == null) return <span style={{ color: "var(--muted)" }}>Sin ubicación</span>;
  const mapsUrl = `https://www.google.com/maps?q=${f.lat},${f.lng}`;
  return <a href={mapsUrl} target="_blank" rel="noreferrer" style={{ color: "var(--ink)", textDecoration: "underline", fontSize: 12.5 }}>{f.locationLabel ? f.locationLabel.split(",").slice(0, 3).join(",") : `${f.lat.toFixed(4)}, ${f.lng.toFixed(4)}`}</a>;
}
function RelojEnVivo() {
  const [now, setNow] = useState(new Date());
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(t); }, []);
  return <>{fmtTime(now)}</>;
}

/* =================================================================
   PANTALLA 2 — IMPUTACIÓN DE HORAS
================================================================= */
const CONCEPTOS_ESPECIALES = ["Baja médica", "Asuntos propios"];
const ESPECIAL_COLOR = { "Baja médica": "#B3433A", "Asuntos propios": "#5B6BA8" };

function opcionesDe(config, user) {
  if (!config) return { proyectos: [], auxiliares: [], especiales: [] };
  const especiales = config.projects.filter((p) => CONCEPTOS_ESPECIALES.includes(p.name));
  const proyectos = config.projects.filter((p) => !CONCEPTOS_ESPECIALES.includes(p.name)).map((p) => ({ id: p.id, name: p.name }));
  return { proyectos, auxiliares: user.role === "fabrica" ? config.auxTasks.map((t) => ({ id: t.id, name: t.name })) : [], especiales };
}

function SelectorConcepto({ value, onChange, proyectos, auxiliares }) {
  return (
    <select className="input" style={{ flex: 1 }} value={value} onChange={(e) => onChange(e.target.value)}>
      <optgroup label="Proyectos">{proyectos.map((o) => <option key={o.id} value={o.id}>{o.name}</option>)}</optgroup>
      {auxiliares.length > 0 && <optgroup label="Trabajos auxiliares">{auxiliares.map((o) => <option key={o.id} value={o.id}>{o.name}</option>)}</optgroup>}
    </select>
  );
}

function ImputacionHoras({ api, user, config, showToast }) {
  const [fecha, setFecha] = useState(todayISO());
  const [filas, setFilas] = useState([]);
  const [excedentes, setExcedentes] = useState([]);
  const [historial, setHistorial] = useState([]);
  const [estadoEspecial, setEstadoEspecial] = useState(null); // null | "Baja médica" | "Asuntos propios"
  const { proyectos, auxiliares, especiales } = useMemo(() => opcionesDe(config, user), [config, user]);
  const todasOpciones = useMemo(() => [...proyectos, ...auxiliares], [proyectos, auxiliares]);
  const cap = dailyCap(fecha);

  const cargarDia = useCallback((f) => {
    api("GET", "/api/imputaciones?date=" + f).then((rows) => {
      const principales = rows.filter((r) => !r.excedente);
      const extra = rows.filter((r) => r.excedente);
      const especialEncontrado = principales.length === 1 && CONCEPTOS_ESPECIALES.includes(principales[0].projectName) ? principales[0].projectName : null;
      setEstadoEspecial(especialEncontrado);
      setFilas(!especialEncontrado && principales.length ? principales.map((r) => ({ id: r.id, projectId: r.projectId, hours: String(r.hours) })) : [{ id: "n" + Math.random(), projectId: todasOpciones[0]?.id || "", hours: "" }]);
      setExcedentes(extra.map((r) => ({ id: r.id, projectId: r.projectId, hours: String(r.hours) })));
    }).catch(() => {});
  }, [api, todasOpciones]);

  useEffect(() => { if (config) cargarDia(fecha); }, [fecha, config]); // eslint-disable-line
  useEffect(() => { api("GET", "/api/imputaciones").then(setHistorial).catch(() => {}); }, [api]);

  const totalPrincipal = filas.reduce((s, f) => s + (parseFloat(f.hours) || 0), 0);
  const totalExcedente = excedentes.reduce((s, f) => s + (parseFloat(f.hours) || 0), 0);
  const excedeCap = totalPrincipal > cap + 0.001;

  const addFila = () => setFilas((f) => [...f, { id: "n" + Math.random(), projectId: todasOpciones[0]?.id || "", hours: "" }]);
  const removeFila = (id) => setFilas((f) => f.filter((x) => x.id !== id));
  const updateFila = (id, patch) => setFilas((f) => f.map((x) => (x.id === id ? { ...x, ...patch } : x)));
  const quickFill = (projectId) => setFilas([{ id: "n" + Math.random(), projectId, hours: String(cap) }]);

  const toggleEspecial = (nombre) => setEstadoEspecial((actual) => (actual === nombre ? null : nombre));

  const redondear = (n) => Math.round(n * 100) / 100;
  const updateFilaHoras = (id, rawValue) => {
    if (rawValue === "") { updateFila(id, { hours: "" }); return; }
    const num = parseFloat(rawValue);
    if (isNaN(num)) { updateFila(id, { hours: rawValue }); return; }
    const otras = filas.filter((f) => f.id !== id).reduce((s, f) => s + (parseFloat(f.hours) || 0), 0);
    const restante = redondear(Math.max(0, cap - otras));
    if (num > restante) {
      showToast(cap === 0 ? "Este día no admite horas de jornada principal (fin de semana). Usa \"Horas excedentes\"." : `Máximo ${cap}h de jornada principal ese día — te quedan ${restante}h disponibles aquí.`);
      updateFila(id, { hours: restante > 0 ? String(restante) : "" });
    } else {
      updateFila(id, { hours: rawValue });
    }
  };

  const addExcedente = () => setExcedentes((f) => [...f, { id: "n" + Math.random(), projectId: todasOpciones[0]?.id || "", hours: "" }]);
  const removeExcedente = (id) => setExcedentes((f) => f.filter((x) => x.id !== id));
  const updateExcedente = (id, patch) => setExcedentes((f) => f.map((x) => (x.id === id ? { ...x, ...patch } : x)));

  const guardar = async () => {
    if (!estadoEspecial && excedeCap) { showToast(`Las horas de la jornada principal no pueden superar ${cap}h. Usa "Horas excedentes" para el resto.`); return; }
    const nombrePorId = (id) => todasOpciones.find((o) => o.id === id)?.name || "—";
    let entriesPrincipales;
    if (estadoEspecial) {
      const item = especiales.find((e) => e.name === estadoEspecial);
      entriesPrincipales = item && cap > 0 ? [{ projectId: item.id, projectName: item.name, hours: String(cap), excedente: false }] : [];
    } else {
      entriesPrincipales = filas.filter((f) => f.projectId && parseFloat(f.hours) > 0).map((f) => ({ projectId: f.projectId, projectName: nombrePorId(f.projectId), hours: f.hours, excedente: false }));
    }
    const entries = [
      ...entriesPrincipales,
      ...excedentes.filter((f) => f.projectId && parseFloat(f.hours) > 0).map((f) => ({ projectId: f.projectId, projectName: nombrePorId(f.projectId), hours: f.hours, excedente: true })),
    ];
    try {
      await api("PUT", "/api/imputaciones/day", { date: fecha, entries });
      showToast("Imputación guardada.");
      cargarDia(fecha);
      api("GET", "/api/imputaciones").then(setHistorial).catch(() => {});
    } catch (e) { showToast(e.message || "No se pudo guardar."); }
  };

  const roleTag = { oficina: "Oficina", fabrica: "Fábrica", admin: "Administrador" }[user.role];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div className="card">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 4 }}>
          <div>
            <h3 style={{ fontSize: 15 }}>Imputar horas del día</h3>
            <div style={{ fontSize: 12, color: "var(--muted)" }}>{roleTag} · máximo jornada principal: <strong>{cap}h</strong></div>
          </div>
          <input type="date" className="input mono" style={{ width: 170 }} value={fecha} onChange={(e) => setFecha(e.target.value)} />
        </div>

        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", margin: "14px 0" }}>
          {especiales.map((esp) => {
            const color = ESPECIAL_COLOR[esp.name] || "#666";
            const activo = estadoEspecial === esp.name;
            return (
              <button
                key={esp.id}
                onClick={() => toggleEspecial(esp.name)}
                className="btn btn-sm"
                style={{ background: activo ? color : color + "18", color: activo ? "#fff" : color, border: `1px solid ${color}55`, fontWeight: 700 }}
              >
                {activo && <Check size={13} />} {esp.name}
              </button>
            );
          })}
        </div>

        {estadoEspecial ? (
          <div style={{ padding: "12px 14px", borderRadius: 10, background: (ESPECIAL_COLOR[estadoEspecial] || "#666") + "14", border: `1px solid ${(ESPECIAL_COLOR[estadoEspecial] || "#666")}40`, fontSize: 13, color: ESPECIAL_COLOR[estadoEspecial] }}>
            Día marcado como <strong>{estadoEspecial}</strong>{cap > 0 ? ` — se registrarán ${cap}h bajo este concepto.` : " — este día no tiene jornada principal (fin de semana)."} Vuelve a pulsar el botón para quitar la marca.
          </div>
        ) : (
          <>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", margin: "14px 0" }}>
              <span style={{ fontSize: 12, color: "var(--muted)", alignSelf: "center", marginRight: 4 }}>Jornada completa rápida ({cap}h):</span>
              {proyectos.slice(0, 4).map((o) => <button key={o.id} className="btn btn-ghost btn-sm" onClick={() => quickFill(o.id)}>{o.name}</button>)}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {filas.map((f) => (
                <div key={f.id} style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <SelectorConcepto value={f.projectId} onChange={(v) => updateFila(f.id, { projectId: v })} proyectos={proyectos} auxiliares={auxiliares} />
                  <input className="input mono" style={{ width: 92 }} type="number" step="0.25" min="0" max={cap} placeholder="h" value={f.hours} onChange={(e) => updateFilaHoras(f.id, e.target.value)} />
                  <button className="btn btn-danger btn-sm" onClick={() => removeFila(f.id)}><Trash2 size={14} /></button>
                </div>
              ))}
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 14 }}>
              <button className="btn btn-ghost btn-sm" onClick={addFila}><Plus size={14} /> Añadir concepto</button>
              <div style={{ fontSize: 13, fontWeight: 700 }}>Total: <span className="mono" style={{ color: excedeCap ? "var(--warn)" : "var(--ink)" }}>{totalPrincipal}h</span> <span style={{ color: "var(--muted)", fontWeight: 400 }}>/ {cap}h</span></div>
            </div>
            {excedeCap && <div style={{ marginTop: 10, fontSize: 12.5, color: "var(--warn)", display: "flex", gap: 6, alignItems: "flex-start" }}><AlertTriangle size={14} style={{ flexShrink: 0, marginTop: 1 }} /><span>Superas el máximo de {cap}h para este día. Mueve el resto a "Horas excedentes" más abajo.</span></div>}
          </>
        )}
      </div>

      <div className="card" style={{ borderColor: "#EAD9BE", background: "#FBF6EE" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
          <div>
            <h3 style={{ fontSize: 14, color: "var(--accent-ink)" }}>⏱ Horas excedentes</h3>
            <div style={{ fontSize: 12, color: "var(--muted)" }}>Horas trabajadas fuera de la jornada principal (no cuentan para el límite de {cap}h).</div>
          </div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 12 }}>
          {excedentes.map((f) => (
            <div key={f.id} style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <SelectorConcepto value={f.projectId} onChange={(v) => updateExcedente(f.id, { projectId: v })} proyectos={proyectos} auxiliares={auxiliares} />
              <input className="input mono" style={{ width: 92 }} type="number" step="0.25" min="0" max="24" placeholder="h" value={f.hours} onChange={(e) => updateExcedente(f.id, { hours: e.target.value })} />
              <button className="btn btn-danger btn-sm" onClick={() => removeExcedente(f.id)}><Trash2 size={14} /></button>
            </div>
          ))}
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 12 }}>
          <button className="btn btn-ghost btn-sm" onClick={addExcedente}><Plus size={14} /> Añadir hora excedente</button>
          {totalExcedente > 0 && <div style={{ fontSize: 13, fontWeight: 700, color: "var(--accent-ink)" }}>Excedente: <span className="mono">{totalExcedente}h</span></div>}
        </div>
      </div>

      <button className="btn btn-primary" style={{ justifyContent: "center" }} onClick={guardar}><Check size={16} /> Guardar imputación del día</button>

      <div className="card">
        <h3 style={{ fontSize: 15, marginBottom: 10 }}>Tus últimos días imputados</h3>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Fecha</th><th>Concepto</th><th>Horas</th><th></th></tr></thead>
            <tbody>
              {historial.map((i) => <tr key={i.id}><td className="mono">{i.date}</td><td>{i.projectName}</td><td className="mono">{i.hours}h</td><td>{i.excedente && <span className="pill" style={{ background: "#FBF0DC", color: "var(--accent-ink)" }}>excedente</span>}</td></tr>)}
              {historial.length === 0 && <tr><td colSpan={4} style={{ color: "var(--muted)", textAlign: "center", padding: 16 }}>Todavía no hay imputaciones.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* =================================================================
   PANTALLA 3 — CALENDARIO
================================================================= */
const TIPO_EVENTO = { festivo: { label: "Festivo", color: "#C1440E" }, vacaciones: { label: "Vacaciones", color: "#3B6FA0" }, evento: { label: "Evento", color: "#8A5A2B" } };
const AMBITO_LABEL = { nacional: "Nacional", autonomico: "Autonómico", local: "Local" };

function Calendario({ api, user, events, refreshEvents, config }) {
  const [cursor, setCursor] = useState(new Date());
  const [diaSel, setDiaSel] = useState(null);
  const isAdmin = user.role === "admin";
  const year = cursor.getFullYear(); const month = cursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = []; for (let i = 0; i < startOffset; i++) cells.push(null); for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const eventosDe = (iso) => events.filter((e) => e.date === iso);

  return (
    <div className="layout-cal">
      <div className="card">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <button className="btn btn-ghost btn-sm" onClick={() => setCursor(new Date(year, month - 1, 1))}><ChevronLeft size={14} /></button>
          <h3 style={{ fontSize: 16 }}>{MESES[month]} {year}</h3>
          <button className="btn btn-ghost btn-sm" onClick={() => setCursor(new Date(year, month + 1, 1))}><ChevronRight size={14} /></button>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4, fontSize: 11, color: "var(--muted)", marginBottom: 4, textTransform: "uppercase", fontWeight: 700 }}>
          {["L", "M", "X", "J", "V", "S", "D"].map((d) => <div key={d} style={{ textAlign: "center" }}>{d}</div>)}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4, gridAutoRows: "1fr" }}>
          {cells.map((d, idx) => {
            if (d === null) return <div key={idx} />;
            const iso = `${year}-${pad(month + 1)}-${pad(d)}`;
            const evs = eventosDe(iso); const finde = isWeekend(iso); const esHoy = iso === todayISO();
            const visibles = evs.slice(0, 2); const resto = evs.length - visibles.length;
            return (
              <div key={idx} className="cal-cell" onClick={() => setDiaSel(iso)} style={{ border: esHoy ? "2px solid var(--primary)" : "1px solid var(--line)", background: finde ? "#FAFAF8" : "#fff" }}>
                <div className="mono" style={{ fontSize: 11, color: finde ? "var(--muted)" : "var(--ink)" }}>{d}</div>
                {visibles.map((e) => <div key={e.id} className="cal-tag" style={{ background: TIPO_EVENTO[e.type].color + "22", color: TIPO_EVENTO[e.type].color }}>{e.time ? e.time + " " : ""}{e.title || TIPO_EVENTO[e.type].label}</div>)}
                {resto > 0 && <div className="cal-tag" style={{ background: "#EEECE6", color: "var(--muted)" }}>+{resto} más</div>}
              </div>
            );
          })}
        </div>
        <div style={{ display: "flex", gap: 14, marginTop: 14, fontSize: 12, flexWrap: "wrap" }}>
          {Object.entries(TIPO_EVENTO).map(([k, v]) => <div key={k} style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 9, height: 9, borderRadius: 3, background: v.color, display: "inline-block" }} /> {v.label}</div>)}
        </div>
        <div style={{ fontSize: 11.5, color: "var(--muted)", marginTop: 10 }}>Toca cualquier día para ver el detalle{isAdmin ? " o añadir un evento" : ""}.</div>
      </div>

      <div className="card">
        <h3 style={{ fontSize: 14, marginBottom: 10 }}>Próximos eventos</h3>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 420, overflowY: "auto" }} className="scrollbar">
          {events.filter((e) => e.date >= todayISO()).sort((a, b) => (a.date > b.date ? 1 : -1)).slice(0, 20).map((e) => (
            <div key={e.id} style={{ borderLeft: `3px solid ${TIPO_EVENTO[e.type].color}`, paddingLeft: 8, cursor: "pointer" }} onClick={() => setDiaSel(e.date)}>
              <div style={{ fontSize: 12.5, fontWeight: 700 }}>{e.title || TIPO_EVENTO[e.type].label}</div>
              <div className="mono" style={{ fontSize: 11, color: "var(--muted)" }}>{e.date}{e.time ? " · " + e.time : ""} · {TIPO_EVENTO[e.type].label}</div>
            </div>
          ))}
          {events.filter((e) => e.date >= todayISO()).length === 0 && <div style={{ color: "var(--muted)", fontSize: 12.5 }}>No hay eventos próximos.</div>}
        </div>
      </div>

      {diaSel && (
        <DayModal
          fecha={diaSel} eventos={eventosDe(diaSel)} isAdmin={isAdmin} users={config?.users || []}
          onClose={() => setDiaSel(null)}
          onAdd={async (ev) => { await api("POST", "/api/events", { date: diaSel, ...ev }); refreshEvents(); }}
          onDelete={async (id) => { await api("DELETE", "/api/events/" + id); refreshEvents(); }}
        />
      )}
    </div>
  );
}

function nombreUsuario(users, id) { return users.find((u) => u.id === id)?.name || "—"; }

function DayModal({ fecha, eventos, isAdmin, users, onClose, onAdd, onDelete }) {
  const [creando, setCreando] = useState(false);
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(20,25,35,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 16 }} onClick={onClose}>
      <div className="card scrollbar" style={{ width: 460, maxWidth: "100%", maxHeight: "88vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <h3 style={{ fontSize: 16 }} className="mono">{fecha}</h3>
          <button className="btn btn-ghost btn-sm" onClick={onClose}><X size={14} /></button>
        </div>

        {eventos.length > 0 && (
          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 16 }}>
            {eventos.map((e) => <EventoDetalle key={e.id} e={e} users={users} isAdmin={isAdmin} onDelete={onDelete} />)}
          </div>
        )}
        {eventos.length === 0 && !isAdmin && <div style={{ color: "var(--muted)", fontSize: 13, marginBottom: 10 }}>No hay eventos este día.</div>}

        {isAdmin && !creando && <button className="btn btn-primary btn-sm" onClick={() => setCreando(true)}><Plus size={14} /> Añadir evento</button>}
        {isAdmin && creando && <FormularioEvento users={users} onCancel={() => setCreando(false)} onSave={async (ev) => { await onAdd(ev); setCreando(false); }} />}
      </div>
    </div>
  );
}

function EventoDetalle({ e, users, isAdmin, onDelete }) {
  const info = TIPO_EVENTO[e.type];
  return (
    <div style={{ border: "1px solid var(--line)", borderRadius: 10, padding: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
        <div>
          <span className="pill" style={{ background: info.color + "22", color: info.color }}>{info.label}</span>
          <div style={{ fontWeight: 700, fontSize: 14, marginTop: 6 }}>{e.title || info.label}</div>
        </div>
        {isAdmin && <button className="btn btn-danger btn-sm" onClick={() => onDelete(e.id)}><Trash2 size={13} /></button>}
      </div>
      <div style={{ fontSize: 12.5, color: "var(--muted)", marginTop: 8, display: "flex", flexDirection: "column", gap: 4 }}>
        {e.time && <div>🕐 {e.time}</div>}
        {e.location && <div>📍 {e.location}</div>}
        {e.type === "festivo" && <div>{AMBITO_LABEL[e.festivoScope] || "Nacional"}{e.festivoLugar ? ` · ${e.festivoLugar}` : ""}{(e.festivoScope === "local") ? " · no exime de fichar a quien no sea de esa localidad" : ""}</div>}
        {e.type === "evento" && <div>👥 {e.invitados === "todos" ? "Todos los trabajadores" : (e.invitados || []).map((id) => nombreUsuario(users, id)).join(", ") || "Sin convocados"}</div>}
        {e.alerta && e.alerta.activa && <div>🔔 Aviso {OPCIONES_AVISO.find((o) => o.value === e.alerta.minutosAntes)?.label || `${e.alerta.minutosAntes} min antes`}</div>}
      </div>
      {e.description && <div style={{ fontSize: 13, marginTop: 10, borderTop: "1px solid var(--line)", paddingTop: 10, whiteSpace: "pre-wrap" }}>{e.description}</div>}
    </div>
  );
}

function FormularioEvento({ users, onCancel, onSave }) {
  const [tipo, setTipo] = useState("evento");
  const [titulo, setTitulo] = useState("");
  const [hora, setHora] = useState("");
  const [lugar, setLugar] = useState("");
  const [descripcion, setDescripcion] = useState("");
  const [todos, setTodos] = useState(true);
  const [seleccionados, setSeleccionados] = useState([]);
  const [avisoActivo, setAvisoActivo] = useState(false);
  const [minutosAntes, setMinutosAntes] = useState(60);
  const [ambito, setAmbito] = useState("nacional");
  const [festivoLugar, setFestivoLugar] = useState("");

  const toggleUsuario = (id) => setSeleccionados((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id]));

  const guardar = () => {
    const ev = { type: tipo, title: titulo };
    if (tipo === "evento") {
      ev.time = hora || null; ev.location = lugar; ev.description = descripcion;
      ev.invitados = todos ? "todos" : seleccionados;
      ev.alerta = { activa: avisoActivo, minutosAntes };
    }
    if (tipo === "festivo") { ev.festivoScope = ambito; ev.festivoLugar = ambito === "nacional" ? "" : festivoLugar; }
    onSave(ev);
  };

  return (
    <div style={{ marginTop: 14, borderTop: "1px solid var(--line)", paddingTop: 14 }}>
      <label style={{ fontSize: 12, fontWeight: 600, color: "var(--muted)" }}>Tipo</label>
      <select className="input" style={{ margin: "6px 0 10px" }} value={tipo} onChange={(e) => setTipo(e.target.value)}>
        <option value="evento">Evento / Reunión</option>
        <option value="festivo">Festivo</option>
        <option value="vacaciones">Vacaciones</option>
      </select>

      <label style={{ fontSize: 12, fontWeight: 600, color: "var(--muted)" }}>Título</label>
      <input className="input" style={{ margin: "6px 0 10px" }} placeholder={tipo === "evento" ? "Ej. Reunión de producción" : tipo === "festivo" ? "Ej. Fiestas del pueblo" : "Ej. Vacaciones de verano"} value={titulo} onChange={(e) => setTitulo(e.target.value)} />

      {tipo === "festivo" && (
        <>
          <label style={{ fontSize: 12, fontWeight: 600, color: "var(--muted)" }}>Ámbito</label>
          <select className="input" style={{ margin: "6px 0 10px" }} value={ambito} onChange={(e) => setAmbito(e.target.value)}>
            <option value="nacional">Nacional (afecta a todos, elimina la alerta de fichaje)</option>
            <option value="autonomico">Autonómico (afecta a todos, elimina la alerta de fichaje)</option>
            <option value="local">Local (informativo — NO elimina la alerta de fichaje)</option>
          </select>
          {ambito !== "nacional" && (
            <>
              <label style={{ fontSize: 12, fontWeight: 600, color: "var(--muted)" }}>{ambito === "autonomico" ? "Comunidad autónoma" : "Localidad"}</label>
              <input className="input" style={{ margin: "6px 0 10px" }} placeholder={ambito === "autonomico" ? "Ej. Comunidad de Madrid" : "Ej. Alcorcón"} value={festivoLugar} onChange={(e) => setFestivoLugar(e.target.value)} />
            </>
          )}
        </>
      )}

      {tipo === "evento" && (
        <>
          <div style={{ display: "flex", gap: 8 }}>
            <div style={{ flex: 1 }}><label style={{ fontSize: 12, fontWeight: 600, color: "var(--muted)" }}>Hora</label><input type="time" className="input mono" style={{ marginTop: 6 }} value={hora} onChange={(e) => setHora(e.target.value)} /></div>
            <div style={{ flex: 2 }}><label style={{ fontSize: 12, fontWeight: 600, color: "var(--muted)" }}>Ubicación</label><input className="input" style={{ marginTop: 6 }} placeholder="Ej. Sala de reuniones" value={lugar} onChange={(e) => setLugar(e.target.value)} /></div>
          </div>
          <label style={{ fontSize: 12, fontWeight: 600, color: "var(--muted)", display: "block", marginTop: 10 }}>De qué trata</label>
          <textarea className="input" style={{ marginTop: 6 }} placeholder="Comentario o nota explicando el evento…" value={descripcion} onChange={(e) => setDescripcion(e.target.value)} />

          <label style={{ fontSize: 12, fontWeight: 600, color: "var(--muted)", display: "block", marginTop: 12 }}>Convocados</label>
          <div className="checkrow"><input type="checkbox" checked={todos} onChange={(e) => setTodos(e.target.checked)} id="todos-cb" /><label htmlFor="todos-cb">Todos los trabajadores</label></div>
          {!todos && (
            <div style={{ maxHeight: 140, overflowY: "auto", border: "1px solid var(--line)", borderRadius: 8, padding: "4px 10px", marginTop: 4 }} className="scrollbar">
              {users.filter((u) => u.role !== "admin").map((u) => (
                <div className="checkrow" key={u.id}><input type="checkbox" checked={seleccionados.includes(u.id)} onChange={() => toggleUsuario(u.id)} id={"u-" + u.id} /><label htmlFor={"u-" + u.id}>{u.name}</label></div>
              ))}
            </div>
          )}

          <div className="checkrow" style={{ marginTop: 12 }}><input type="checkbox" checked={avisoActivo} onChange={(e) => setAvisoActivo(e.target.checked)} id="aviso-cb" /><label htmlFor="aviso-cb">Avisar a los convocados</label></div>
          {avisoActivo && (
            <select className="input" style={{ marginTop: 6 }} value={minutosAntes} onChange={(e) => setMinutosAntes(Number(e.target.value))}>
              {OPCIONES_AVISO.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
            </select>
          )}
        </>
      )}

      <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
        <button className="btn btn-ghost" style={{ flex: 1, justifyContent: "center" }} onClick={onCancel}>Cancelar</button>
        <button className="btn btn-primary" style={{ flex: 1, justifyContent: "center" }} onClick={guardar} disabled={!titulo.trim()}><Plus size={14} /> Guardar</button>
      </div>
    </div>
  );
}

/* =================================================================
   ADMINISTRACIÓN
================================================================= */
function Admin({ api, config, refreshConfig, showToast }) {
  const [sub, setSub] = useState("informes");
  return (
    <div>
      <div style={{ display: "flex", gap: 6, marginBottom: 16, flexWrap: "wrap" }}>
        {[["informes", "Informes", <Download size={14} key="i" />], ["usuarios", "Usuarios", <Users size={14} key="u" />], ["proyectos", "Proyectos", <Briefcase size={14} key="p" />], ["auxiliar", "Auxiliares", <Cog size={14} key="a" />]].map(([k, label, icon]) => (
          <button key={k} className={`btn btn-sm ${sub === k ? "btn-primary" : "btn-ghost"}`} onClick={() => setSub(k)}>{icon}{label}</button>
        ))}
      </div>
      {sub === "informes" && <Informes api={api} />}
      {sub === "usuarios" && <GestionUsuarios api={api} refreshConfig={refreshConfig} showToast={showToast} />}
      {sub === "proyectos" && <GestionFamilia api={api} config={config} refreshConfig={refreshConfig} showToast={showToast} familia="proyectos" />}
      {sub === "auxiliar" && <GestionFamilia api={api} config={config} refreshConfig={refreshConfig} showToast={showToast} familia="auxiliares" />}
    </div>
  );
}

function Informes({ api }) {
  const [desde, setDesde] = useState(toISODate(new Date(new Date().getFullYear(), new Date().getMonth(), 1)));
  const [hasta, setHasta] = useState(todayISO());
  const [fichajes, setFichajes] = useState([]);
  const [imputaciones, setImputaciones] = useState([]);
  const [cargando, setCargando] = useState(false);

  const cargar = useCallback(() => {
    setCargando(true);
    Promise.all([api("GET", `/api/fichajes?desde=${desde}&hasta=${hasta}`), api("GET", `/api/imputaciones/report?desde=${desde}&hasta=${hasta}`)])
      .then(([f, i]) => { setFichajes(f); setImputaciones(i); }).finally(() => setCargando(false));
  }, [api, desde, hasta]);
  useEffect(() => { cargar(); }, [cargar]);

  const exportarExcel = () => {
    const wb = XLSX.utils.book_new();
    const wsFichajes = XLSX.utils.json_to_sheet(fichajes.map((f) => ({ Usuario: f.userName, Fecha: f.date, Hora: f.time, Tipo: f.type, Latitud: f.lat, Longitud: f.lng, Ubicación: f.locationLabel || "" })));
    XLSX.utils.book_append_sheet(wb, wsFichajes, "Fichajes");
    const wsImput = XLSX.utils.json_to_sheet(imputaciones.map((i) => ({ Usuario: i.userName, Fecha: i.date, Concepto: i.projectName, Horas: i.hours, Excedente: i.excedente ? "Sí" : "No" })));
    XLSX.utils.book_append_sheet(wb, wsImput, "Imputaciones");
    XLSX.writeFile(wb, `informe_${desde}_a_${hasta}.xlsx`);
  };
  const enviarPorCorreo = () => {
    const cuerpo = encodeURIComponent(`Informe de fichajes e imputaciones (${desde} a ${hasta})\n\nFichajes: ${fichajes.length}\nImputaciones: ${imputaciones.length}\n\nExporta primero a Excel y adjúntalo manualmente.`);
    window.open(`mailto:?subject=${encodeURIComponent("Informe de fichajes e imputaciones")}&body=${cuerpo}`, "_blank");
  };
  const totalHorasPorUsuario = useMemo(() => { const acc = {}; imputaciones.forEach((i) => { acc[i.userName] = (acc[i.userName] || 0) + i.hours; }); return acc; }, [imputaciones]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div className="card">
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div><label style={{ fontSize: 12, fontWeight: 600, color: "var(--muted)" }}>Desde</label><input type="date" className="input mono" style={{ marginTop: 4 }} value={desde} onChange={(e) => setDesde(e.target.value)} /></div>
          <div><label style={{ fontSize: 12, fontWeight: 600, color: "var(--muted)" }}>Hasta</label><input type="date" className="input mono" style={{ marginTop: 4 }} value={hasta} onChange={(e) => setHasta(e.target.value)} /></div>
          <button className="btn btn-primary" onClick={exportarExcel} disabled={cargando}><Download size={14} /> Exportar a Excel</button>
          <button className="btn btn-ghost" onClick={enviarPorCorreo}><Mail size={14} /> Enviar por correo</button>
        </div>
      </div>
      <div className="card">
        <h3 style={{ fontSize: 14, marginBottom: 10 }}>Horas imputadas por trabajador (periodo)</h3>
        <div className="table-wrap"><table><thead><tr><th>Trabajador</th><th>Total horas</th></tr></thead><tbody>
          {Object.entries(totalHorasPorUsuario).map(([name, h]) => <tr key={name}><td>{name}</td><td className="mono">{h}h</td></tr>)}
          {Object.keys(totalHorasPorUsuario).length === 0 && <tr><td colSpan={2} style={{ textAlign: "center", color: "var(--muted)", padding: 16 }}>Sin datos en el periodo.</td></tr>}
        </tbody></table></div>
      </div>
      <div className="card">
        <h3 style={{ fontSize: 14, marginBottom: 10 }}>Fichajes del periodo ({fichajes.length})</h3>
        <div className="table-wrap scrollbar" style={{ maxHeight: 320, overflowY: "auto" }}>
          <table><thead><tr><th>Usuario</th><th>Fecha</th><th>Hora</th><th>Tipo</th><th>Ubicación</th></tr></thead><tbody>
            {[...fichajes].sort((a, b) => (a.timestamp < b.timestamp ? 1 : -1)).map((f) => (
              <tr key={f.id}><td>{f.userName}</td><td className="mono">{f.date}</td><td className="mono">{f.time}</td>
              <td><span className="pill" style={{ background: f.type === "entrada" ? "#E7F3EC" : "#FBEAEA", color: f.type === "entrada" ? "var(--ok)" : "var(--warn)" }}>{f.type}</span></td>
              <td><UbicacionCelda f={f} /></td></tr>
            ))}
          </tbody></table>
        </div>
      </div>
    </div>
  );
}

function GestionUsuarios({ api, refreshConfig, showToast }) {
  const [usuarios, setUsuarios] = useState([]);
  const [respProy, setRespProy] = useState([]);
  const [respAux, setRespAux] = useState([]);
  const [nombre, setNombre] = useState("");
  const [role, setRole] = useState("oficina");
  const [pin, setPin] = useState("1234");

  const cargar = useCallback(() => {
    api("GET", "/api/users").then(setUsuarios).catch(() => {});
    api("GET", "/api/config").then((c) => { setRespProy(c.responsablesProyecto); setRespAux(c.responsablesAuxiliar); }).catch(() => {});
  }, [api]);
  useEffect(() => { cargar(); }, [cargar]);

  const addUser = async () => { if (!nombre.trim()) return; await api("POST", "/api/users", { name: nombre.trim(), role, pin }); setNombre(""); cargar(); refreshConfig(); showToast("Trabajador añadido."); };
  const delUser = async (id) => { await api("DELETE", "/api/users/" + id); cargar(); refreshConfig(); };
  const toggleRespProy = async (id) => { await api("PATCH", `/api/users/${id}/responsable-proyecto`); cargar(); refreshConfig(); };
  const toggleRespAux = async (id) => { await api("PATCH", `/api/users/${id}/responsable-auxiliar`); cargar(); refreshConfig(); };

  const roleLabels = { admin: "Administrador", oficina: "Oficina", fabrica: "Fábrica" };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div className="card">
        <h3 style={{ fontSize: 14, marginBottom: 10 }}>Nuevo trabajador</h3>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <input className="input" style={{ flex: 2, minWidth: 160 }} placeholder="Nombre" value={nombre} onChange={(e) => setNombre(e.target.value)} />
          <select className="input" style={{ flex: 1, minWidth: 160 }} value={role} onChange={(e) => setRole(e.target.value)}>
            <option value="oficina">Oficina</option>
            <option value="fabrica">Fábrica</option>
            <option value="admin">Administrador</option>
          </select>
          <input className="input mono" style={{ width: 90 }} placeholder="PIN" value={pin} onChange={(e) => setPin(e.target.value)} />
          <button className="btn btn-primary" onClick={addUser}><Plus size={14} /> Añadir</button>
        </div>
      </div>
      <div className="card">
        <h3 style={{ fontSize: 14, marginBottom: 10 }}>Trabajadores</h3>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Nombre</th><th>Rol</th><th>PIN</th><th>Resp. proyectos</th><th>Resp. auxiliares</th><th></th></tr></thead>
            <tbody>
              {usuarios.map((u) => (
                <tr key={u.id}>
                  <td>{u.name}</td><td>{roleLabels[u.role]}</td><td className="mono">{u.pin}</td>
                  <td>{u.role !== "admin" && <button className={`btn btn-sm ${respProy.includes(u.id) ? "btn-accent" : "btn-ghost"}`} onClick={() => toggleRespProy(u.id)}><ShieldCheck size={13} /> {respProy.includes(u.id) ? "Sí" : "No"}</button>}</td>
                  <td>{u.role !== "admin" && <button className={`btn btn-sm ${respAux.includes(u.id) ? "btn-accent" : "btn-ghost"}`} onClick={() => toggleRespAux(u.id)}><ShieldCheck size={13} /> {respAux.includes(u.id) ? "Sí" : "No"}</button>}</td>
                  <td>{u.role !== "admin" && <button className="btn btn-danger btn-sm" onClick={() => delUser(u.id)}><Trash2 size={13} /></button>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{ fontSize: 11.5, color: "var(--muted)", marginTop: 10 }}>"Resp. proyectos" y "Resp. auxiliares" dan permiso para crear/gestionar conceptos en esa familia, sin ser administrador. Comunica el PIN a cada trabajador para que entre desde su móvil.</div>
      </div>
    </div>
  );
}

function GestionFamilia({ api, config, refreshConfig, showToast, familia }) {
  const esProyectos = familia === "proyectos";
  const items = esProyectos ? (config?.projects || []) : (config?.auxTasks || []);
  const basePath = esProyectos ? "/api/projects" : "/api/aux-tasks";
  const [nombre, setNombre] = useState("");
  const [fijo, setFijo] = useState(false);

  const addItem = async () => {
    if (!nombre.trim()) return;
    try { await api("POST", basePath, { name: nombre.trim(), fixed: fijo }); setNombre(""); setFijo(false); refreshConfig(); showToast("Añadido."); }
    catch (e) { showToast(e.message); }
  };
  const toggleFijo = async (item) => { try { await api("PATCH", `${basePath}/${item.id}`, { fixed: !item.fixed }); refreshConfig(); } catch (e) { showToast(e.message); } };
  const delItem = async (id) => { try { await api("DELETE", `${basePath}/${id}`); refreshConfig(); } catch (e) { showToast(e.message); } };

  return (
    <div className="card">
      <h3 style={{ fontSize: 14, marginBottom: 4 }}>{esProyectos ? "Proyectos — Oficina y Fábrica" : "Trabajos auxiliares — Solo Fábrica"}</h3>
      <p style={{ fontSize: 12, color: "var(--muted)", marginTop: 0, marginBottom: 12 }}>
        {esProyectos ? "Visible en la imputación de horas de oficina y fábrica." : "Visible solo en la imputación de horas de los trabajadores de fábrica."} Marca "fijo" para que no se pueda borrar sin desmarcarlo antes.
      </p>
      <div style={{ display: "flex", gap: 8, marginBottom: 8, flexWrap: "wrap", alignItems: "center" }}>
        <input className="input" style={{ flex: 1, minWidth: 180 }} placeholder="Nombre" value={nombre} onChange={(e) => setNombre(e.target.value)} />
        <label className="checkrow" style={{ padding: 0 }}><input type="checkbox" checked={fijo} onChange={(e) => setFijo(e.target.checked)} /> Fijo</label>
        <button className="btn btn-primary" onClick={addItem}><Plus size={14} /> Añadir</button>
      </div>
      <div className="table-wrap"><table><thead><tr><th>Nombre</th><th>Fijo</th><th></th></tr></thead><tbody>
        {items.map((it) => (
          <tr key={it.id}>
            <td>{it.name}</td>
            <td><button className={`btn btn-sm ${it.fixed ? "btn-accent" : "btn-ghost"}`} onClick={() => toggleFijo(it)}>{it.fixed ? "Fijo" : "No fijo"}</button></td>
            <td><button className="btn btn-danger btn-sm" onClick={() => delItem(it.id)} disabled={it.fixed} title={it.fixed ? "Desmarca 'fijo' antes de borrar" : ""}><Trash2 size={13} /></button></td>
          </tr>
        ))}
      </tbody></table></div>
    </div>
  );
}
